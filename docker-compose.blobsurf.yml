# docker-compose.blobsurf.yml — Stack production BlobSurf (blobsurf.com)
#
# Différences structurelles par rapport à docker-compose.vps.yml :
#   - Caddy remplace nginx (TLS Let's Encrypt automatique — pas de mkcert)
#   - Volume caddy-data : stockage persistant des certificats Let's Encrypt
#   - Nom de projet : blobconnect-blobsurf (volumes/réseau distincts du stack vps)
#   - Domaine par défaut : *.blobsurf.com (APP_DOMAIN=blobsurf.com sans préfixe app.)
#   - CADDY_ACME_EMAIL requis dans .env.vps pour Let's Encrypt
#
# Cohérence critique :
#   MINIO_SERVER_URL == S3_PRESIGN_ENDPOINT == https://$STORAGE_DOMAIN
#   Sans cela, MinIO rejette les PUT présignés (403 SignatureDoesNotMatch)
#
# Usage :
#   cp .env.vps.example .env.vps && vim .env.vps   # ajouter CADDY_ACME_EMAIL
#   docker compose -f docker-compose.blobsurf.yml --env-file .env.vps up -d
#
# Reload Caddy seul (CORS fix, Caddyfile update) :
#   docker compose -f docker-compose.blobsurf.yml --env-file .env.vps restart caddy
#   # Ou rechargement sans downtime :
#   docker compose -f docker-compose.blobsurf.yml --env-file .env.vps exec caddy caddy reload --config /etc/caddy/Caddyfile

name: blobconnect-blobsurf

services:

  # ─── Base de données ────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-blobsurf_vps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-blobsurf_vps}
    networks:
      - blobsurf
    volumes:
      - pgdata-blobsurf:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-blobsurf_vps}"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ─── Cache / Rate-limit / Sessions ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    networks:
      - blobsurf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Stockage objet (S3-compatible) ─────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      # CRITIQUE : MINIO_SERVER_URL doit correspondre au domaine public TLS.
      # MinIO valide le Host header des URLs présignées contre cette valeur.
      # Doit être identique à S3_PRESIGN_ENDPOINT dans le service api.
      MINIO_SERVER_URL: "https://${STORAGE_DOMAIN:-storage.blobsurf.com}"
    command: server /data --console-address ":9001"
    networks:
      - blobsurf
    volumes:
      - miniodata-blobsurf:/data
    # Aucun port exposé sur l'hôte — accès via Caddy uniquement.
    # Console MinIO accessible via tunnel SSH : ssh -L 9001:localhost:9001 user@vps
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── API Node.js (build production) ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.production.Dockerfile
    restart: unless-stopped
    env_file: .env.vps
    environment:
      # Variables Docker internes — surchargent .env.vps
      DATABASE_URL: "postgresql://${POSTGRES_USER:-blobsurf_vps}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blobsurf_vps}"
      REDIS_URL:    "redis://default:${REDIS_PASSWORD}@redis:6379/0"
      # S3_ENDPOINT : connexion interne API → MinIO (réseau Docker, pas de TLS interne)
      S3_ENDPOINT:  "http://minio:9000"
      # S3_PRESIGN_ENDPOINT : URL vue par le navigateur pour les PUTs présignés.
      # DOIT correspondre à MINIO_SERVER_URL sur le container MinIO.
      S3_PRESIGN_ENDPOINT:  "https://${STORAGE_DOMAIN:-storage.blobsurf.com}"
      # S3_PUBLIC_URL_BASE : URL de base pour les avatars publics (lecture anonyme).
      S3_PUBLIC_URL_BASE:   "https://${STORAGE_DOMAIN:-storage.blobsurf.com}/${S3_BUCKET:-blobsurf-vps}"
      SECURITY_MONITOR_TOKEN: "${SECURITY_MONITOR_TOKEN}"
      APP_ENV: "vps"
    volumes:
      # État backup admin-safe (last-backup.json) — LECTURE SEULE, dossier dédié.
      # L'API ne lit JAMAIS les dumps PostgreSQL (eux restent isolés en 700).
      - /var/lib/blob/status:/var/lib/blob/status:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - blobsurf
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Frontend Next.js (build production) ────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.production.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://${API_DOMAIN:-api.blobsurf.com}"
    restart: unless-stopped
    env_file: .env.vps
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - blobsurf
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  # ─── Reverse proxy TLS (Caddy + Let's Encrypt) ──────────────────────────────
  #
  # Caddy gère :
  #   - TLS automatique Let's Encrypt (renouvellement auto)
  #   - CORS pour storage.blobsurf.com (docker/Caddyfile)
  #   - Proxy api.blobsurf.com → api:4000
  #   - Proxy blobsurf.com → web:3000
  #   - Proxy storage.blobsurf.com → minio:9000
  #
  # Volume caddy-data : certificats Let's Encrypt persistants (NE PAS supprimer)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      - blobsurf
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      # Email ACME pour Let's Encrypt (obligatoire — Let's Encrypt requiert un email valide)
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
      # Domaines — injectés dans le Caddyfile via {$VAR} (substitution parse-time Caddy)
      APP_DOMAIN:     ${APP_DOMAIN:-blobsurf.com}
      API_DOMAIN:     ${API_DOMAIN:-api.blobsurf.com}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:-storage.blobsurf.com}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

# ─── Réseau isolé ─────────────────────────────────────────────────────────────
networks:
  blobsurf:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

# ─── Volumes persistants ───────────────────────────────────────────────────────
volumes:
  pgdata-blobsurf:
  miniodata-blobsurf:
  caddy-data:        # Certificats Let's Encrypt — NE PAS supprimer
