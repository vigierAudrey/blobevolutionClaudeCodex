workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH =~ /^ci\/gitlab-/'
    - when: never

stages:
  - fast

default:
  image: node:22-bookworm
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.28.2 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

fast:
  stage: fast
  timeout: 15 minutes
  variables:
    NODE_ENV: test
    NEXT_TELEMETRY_DISABLED: "1"
  script:
    - bash scripts/ci-block-db-push.sh
    - bash scripts/no-unsafe-db-push-check.sh
    - bash scripts/no-insecure-logs-check.sh
    - bash scripts/check-authz-route-guards.sh
    - pnpm run lint:strict
    - pnpm --filter @blobinfini/api type-check
    - pnpm --filter @blobinfini/web type-check
    - pnpm --filter @blobinfini/api exec jest --config jest.unit.config.cjs --no-coverage --forceExit
    - pnpm run openapi:lint
