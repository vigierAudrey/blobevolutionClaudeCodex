# nginx.vps.conf — Reverse proxy TLS VPS BlobConnect
#
# Trois virtual hosts :
#   api.blobinfini.local   → api:4000    (API Node.js)
#   app.blobinfini.local   → web:3000    (frontend Next.js)
#   storage.blobinfini.local → minio:9000 (stockage objet — CRITIQUE)
#
# La route storage.* est la différence majeure par rapport à nginx.pre-vps.conf :
#   - MinIO n'est PAS exposé directement sur l'hôte (aucun port 9000/9001)
#   - Tout accès S3 passe par ce reverse proxy (upload présigné, lecture publique)
#   - MINIO_SERVER_URL doit correspondre à ce domaine dans docker-compose.vps.yml
#
# Adapter les noms de domaine pour un déploiement VPS réel :
#   Remplacer *.blobinfini.local → *.blobinfini.fr (ou votre domaine)
#   Remplacer les chemins de certs → /etc/letsencrypt/live/... ou chemin certbot
#
# Certs locaux : générés par mkcert via scripts/vps-bootstrap.sh
# Certs production : Let's Encrypt via certbot (hors scope de ce fichier)

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    # 1024 connexions par worker — nécessaire pour WebSocket (chaque connexion WS
    # maintient un descripteur de fichier ouvert jusqu'à déconnexion).
    # 64 était insuffisant et provoquait des refus silencieux sous charge minimale.
    worker_connections 1024;
}

http {
    # Nécessaire pour que le header Connection soit correctement relayé :
    # "upgrade" si le client envoie un Upgrade (WebSocket), "close" sinon.
    # Utiliser une valeur statique "upgrade" pour toutes les requêtes enverrait
    # Connection: upgrade même sur des requêtes HTTP normales (non-standard).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    # Mitigation DoS Next.js 14.x (GHSA — HTTP request deserialization via RSC)
    # Fix complet nécessite >= 15.0.8 (breaking change majeur, refusé).
    # Cette règle limite les requêtes vers le frontend Next.js à 30 req/s par IP,
    # burst=60 pour absorber les chargements initiaux (chunks JS/CSS).
    # N'affecte PAS : API (vhost séparé), uploads (storage vhost), WebSocket (API vhost).
    limit_req_zone $binary_remote_addr zone=nextjs_front:10m rate=30r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream api_backend {
        server api:4000;
    }

    upstream web_backend {
        server web:3000;
    }

    # MinIO en upstream interne — jamais exposé directement sur l'hôte
    upstream minio_backend {
        server minio:9000;
    }

    # HTTP → HTTPS redirect pour tous les virtual hosts
    server {
        listen 80;
        server_name api.blobinfini.local app.blobinfini.local storage.blobinfini.local;
        return 301 https://$host$request_uri;
    }

    # ── API HTTPS ──────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.blobinfini.local;

        ssl_certificate     /etc/nginx/certs/api.blobinfini.local.pem;
        ssl_certificate_key /etc/nginx/certs/api.blobinfini.local-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10m;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support WebSocket (Socket.io)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # ── Web HTTPS ──────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name app.blobinfini.local;

        ssl_certificate     /etc/nginx/certs/app.blobinfini.local.pem;
        ssl_certificate_key /etc/nginx/certs/app.blobinfini.local-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10m;

        location / {
            # DoS mitigation Next.js RSC deserialization (GHSA, fix = >=15.0.8)
            limit_req zone=nextjs_front burst=60 nodelay;

            proxy_pass http://web_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
        }
    }

    # ── Storage HTTPS (MinIO via nginx — clé de ce lot) ────────────────────────
    #
    # Rôle : remplacer l'exposition directe du port 9000 de MinIO sur l'hôte.
    #
    # Flux presigned PUT :
    #   1. API génère presigned PUT URL avec host=storage.blobinfini.local
    #      (via S3_PRESIGN_ENDPOINT=https://storage.blobinfini.local)
    #   2. Client envoie PUT https://storage.blobinfini.local/bucket/key?X-Amz-Signature=...
    #   3. nginx reçoit, proxifie vers minio:9000 en conservant Host: storage.blobinfini.local
    #   4. MinIO valide la signature via MINIO_SERVER_URL=https://storage.blobinfini.local
    #
    # Flux lecture publique (bucket en GET-only anonyme) :
    #   1. API retourne publicUrlForKey = https://storage.blobinfini.local/bucket/key
    #   2. Client lit directement — nginx proxifie vers minio:9000
    #
    # CRITIQUE : proxy_set_header Host $host — MinIO doit voir "storage.blobinfini.local"
    # pour valider les signatures présignées. Ne jamais surcharger avec "minio" ou "minio:9000".
    server {
        listen 443 ssl;
        server_name storage.blobinfini.local;

        ssl_certificate     /etc/nginx/certs/storage.blobinfini.local.pem;
        ssl_certificate_key /etc/nginx/certs/storage.blobinfini.local-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Uploads : fichiers utilisateur (avatars, photos de cours)
        client_max_body_size 50m;

        # Headers sécurité minimaux pour les assets stockage
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location / {
            proxy_pass http://minio_backend;
            proxy_http_version 1.1;

            # CRITIQUE : conserver le Host d'origine pour la validation HMAC MinIO
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts généreux pour les uploads (fichiers 50MB max)
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Pas de buffering pour les gros uploads — transmet directement à MinIO
            proxy_request_buffering off;
        }
    }
}
