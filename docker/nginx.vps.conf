# nginx.vps.conf — Reverse proxy TLS VPS BlobConnect
#
# Trois virtual hosts :
#   api.blobinfini.local   → api:4000    (API Node.js)
#   app.blobinfini.local   → web:3000    (frontend Next.js)
#   storage.blobinfini.local → minio:9000 (stockage objet — CRITIQUE)
#
# La route storage.* est la différence majeure par rapport à nginx.pre-vps.conf :
#   - MinIO n'est PAS exposé directement sur l'hôte (aucun port 9000/9001)
#   - Tout accès S3 passe par ce reverse proxy (upload présigné, lecture publique)
#   - MINIO_SERVER_URL doit correspondre à ce domaine dans docker-compose.vps.yml
#
# Adapter les noms de domaine pour un déploiement VPS réel :
#   Remplacer *.blobinfini.local → *.blobinfini.fr (ou votre domaine)
#   Remplacer les chemins de certs → /etc/letsencrypt/live/... ou chemin certbot
#
# Certs locaux : générés par mkcert via scripts/vps-bootstrap.sh
# Certs production : Let's Encrypt via certbot (hors scope de ce fichier)

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    # 1024 connexions par worker — nécessaire pour WebSocket (chaque connexion WS
    # maintient un descripteur de fichier ouvert jusqu'à déconnexion).
    # 64 était insuffisant et provoquait des refus silencieux sous charge minimale.
    worker_connections 1024;
}

http {
    # Nécessaire pour que le header Connection soit correctement relayé :
    # "upgrade" si le client envoie un Upgrade (WebSocket), "close" sinon.
    # Utiliser une valeur statique "upgrade" pour toutes les requêtes enverrait
    # Connection: upgrade même sur des requêtes HTTP normales (non-standard).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    # Mitigation DoS Next.js 14.x (GHSA — HTTP request deserialization via RSC)
    # Fix complet nécessite >= 15.0.8 (breaking change majeur, refusé).
    # Cette règle limite les requêtes vers le frontend Next.js à 30 req/s par IP,
    # burst=60 pour absorber les chargements initiaux (chunks JS/CSS).
    # N'affecte PAS : API (vhost séparé), uploads (storage vhost), WebSocket (API vhost).
    limit_req_zone $binary_remote_addr zone=nextjs_front:10m rate=30r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream api_backend {
        server api:4000;
    }

    upstream web_backend {
        server web:3000;
    }

    # MinIO en upstream interne — jamais exposé directement sur l'hôte
    upstream minio_backend {
        server minio:9000;
    }

    # Restriction Content-Type PUT vers storage MinIO.
    # AWS SDK v3 s3-request-presigner force content-type en unsignable header (prepareRequest l.49),
    # donc la signature HMAC ne couvre pas le Content-Type effectif — n'importe quel type peut passer.
    # Cette map bloque au niveau nginx les PUT non-image avant qu'ils atteignent MinIO.
    # 0 = type image autorisé / 1 = type non autorisé → 415 Unsupported Media Type
    # Bloc de décision Content-Type pour les PUT storage.
    # Étape 1 : la méthode est-elle PUT ?
    map $request_method $is_storage_put {
        default  0;
        PUT      1;
    }
    # Étape 2 : le Content-Type est-il image valide ?
    # $http_content_type = valeur brute du header Content-Type entrant (avec éventuels params).
    map $http_content_type $is_image_content_type {
        default                   0;
        "~^image/jpeg"            1;
        "~^image/png"             1;
        "~^image/webp"            1;
    }
    # Étape 3 : bloquer si PUT ET Content-Type non-image
    # $storage_put_blocked = 1 ssi PUT avec type invalide
    map $is_storage_put:$is_image_content_type $storage_put_blocked {
        default  0;
        "1:0"    1;
    }

    # CORS : origines autorisées pour l'upload présigné depuis le navigateur.
    # Valeur vide → nginx ne génère pas le header (comportement avec variable vide).
    # Origin stricte — jamais de wildcard sur ce bucket.
    map $http_origin $storage_cors_origin {
        default                    "";
        "https://blobsurf.com"     "https://blobsurf.com";
        # "https://www.blobsurf.com" "https://www.blobsurf.com";  # décommenter si www utilisé
    }

    # HTTP → HTTPS redirect pour tous les virtual hosts
    server {
        listen 80;
        server_name api.blobinfini.local app.blobinfini.local storage.blobinfini.local;
        return 301 https://$host$request_uri;
    }

    # ── API HTTPS ──────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.blobinfini.local;

        ssl_certificate     /etc/nginx/certs/api.blobinfini.local.pem;
        ssl_certificate_key /etc/nginx/certs/api.blobinfini.local-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 10m;

        # Socket.IO — timeouts longs requis pour les connexions WebSocket persistantes.
        # proxy_read_timeout doit être >> pingInterval (25s) + pingTimeout (60s) = 85s.
        # 60s était insuffisant : si l'event loop sature et qu'un ping est retardé > 60s,
        # nginx coupe la connexion avant que Socket.IO ait pu la gérer lui-même.
        # 3600s = valeur standard nginx pour WebSocket (laisse Socket.IO gérer son cycle de vie).
        # Ce path est exclusivement Socket.IO — aucun endpoint REST ne passe par /socket.io/.
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support WebSocket (Socket.io)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # ── Web HTTPS ──────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name app.blobinfini.local;

        ssl_certificate     /etc/nginx/certs/app.blobinfini.local.pem;
        ssl_certificate_key /etc/nginx/certs/app.blobinfini.local-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 10m;

        location / {
            # DoS mitigation Next.js RSC deserialization (GHSA, fix = >=15.0.8)
            limit_req zone=nextjs_front burst=60 nodelay;

            proxy_pass http://web_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
        }
    }

    # ── Storage HTTPS (MinIO via nginx — clé de ce lot) ────────────────────────
    #
    # Rôle : remplacer l'exposition directe du port 9000 de MinIO sur l'hôte.
    #
    # Flux presigned PUT :
    #   1. API génère presigned PUT URL avec host=storage.blobinfini.local
    #      (via S3_PRESIGN_ENDPOINT=https://storage.blobinfini.local)
    #   2. Client envoie PUT https://storage.blobinfini.local/bucket/key?X-Amz-Signature=...
    #   3. nginx reçoit, proxifie vers minio:9000 en conservant Host: storage.blobinfini.local
    #   4. MinIO valide la signature via MINIO_SERVER_URL=https://storage.blobinfini.local
    #
    # Flux lecture publique (bucket en GET-only anonyme) :
    #   1. API retourne publicUrlForKey = https://storage.blobinfini.local/bucket/key
    #   2. Client lit directement — nginx proxifie vers minio:9000
    #
    # CRITIQUE : proxy_set_header Host $host — MinIO doit voir "storage.blobinfini.local"
    # pour valider les signatures présignées. Ne jamais surcharger avec "minio" ou "minio:9000".
    server {
        listen 443 ssl;
        server_name storage.blobinfini.local;

        ssl_certificate     /etc/nginx/certs/storage.blobinfini.local.pem;
        ssl_certificate_key /etc/nginx/certs/storage.blobinfini.local-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Uploads : avatars et photos de cours.
        # 10MB = limite raisonnable pour une photo utilisateur (JPEG/PNG/WebP).
        # 50MB était trop permissif (bucket spam : 10 uploads × 50MB = 500MB/IP/10min).
        client_max_body_size 10m;

        # Note : les security headers sont dans le location block — add_header dans
        # un location block remplace les directives du server block parent (règle
        # d'héritage nginx). Ils doivent être répétés ci-dessous avec les headers CORS.

        location / {
            # ─── CORS preflight ────────────────────────────────────────────────
            # OPTIONS avec return : usage safe de "if" (pas de proxy_pass dans ce bloc).
            # La map $storage_cors_origin filtre les origines — valeur vide = header absent.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $storage_cors_origin always;
                add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header X-Content-Type-Options nosniff always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header Content-Length 0;
                return 204;
            }

            # Bloquer les PUT avec Content-Type non-image (map définie dans le bloc http).
            # Contexte : AWS SDK v3 s3-request-presigner force content-type en unsignable header,
            # donc la signature HMAC ne couvre pas le Content-Type effectif — n'importe quel
            # contenu peut être uploadé malgré la validation backend (image/jpeg|png|webp).
            # GET et OPTIONS passent sans restriction ($storage_put_blocked = 0).
            if ($storage_put_blocked) {
                return 415;
            }

            # ─── Security headers + CORS ───────────────────────────────────────
            # add_header ici écrase les directives du server block parent (nginx inheritance).
            # Tous les security headers doivent être répétés.
            add_header Access-Control-Allow-Origin  $storage_cors_origin always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # Cache-Control : pas de mise en cache proxy pour les assets utilisateur
            add_header Cache-Control "private, no-store" always;

            # Empêche MinIO de doubler ses propres headers CORS si le bucket a une config CORS.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;

            proxy_pass http://minio_backend;
            proxy_http_version 1.1;

            # CRITIQUE : conserver le Host d'origine pour la validation HMAC MinIO
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Pas de buffering pour les gros uploads — transmet directement à MinIO
            proxy_request_buffering off;
        }
    }
}
