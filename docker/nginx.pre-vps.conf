# nginx.pre-vps.conf — Reverse proxy TLS pré-VPS
# Simule un reverse proxy de type VPS (nginx + TLS terminaison).
# Les certs sont générés par mkcert via scripts/pre-vps-bootstrap.sh.
#
# Domaines locaux : api.blobinfini.local  app.blobinfini.local
# Configurer /etc/hosts sur la machine hôte :
#   127.0.0.1  api.blobinfini.local
#   127.0.0.1  app.blobinfini.local
#
# Note : proxy_set_header défini dans chaque location (pas dans http{}) pour
# éviter l'écrasement nginx — un proxy_set_header dans location{} annule
# les defaults du bloc parent.

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    upstream api_backend {
        server api:4000;
    }

    upstream web_backend {
        server web:3000;
    }

    # HTTP → HTTPS redirect (simule le comportement VPS standard)
    server {
        listen 80;
        server_name api.blobinfini.local app.blobinfini.local;
        return 301 https://$host$request_uri;
    }

    # API HTTPS
    server {
        listen 443 ssl;
        server_name api.blobinfini.local;

        ssl_certificate     /etc/nginx/certs/api.blobinfini.local.pem;
        ssl_certificate_key /etc/nginx/certs/api.blobinfini.local-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10m;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # Headers forwarding — définis ici car proxy_set_header dans location
            # annule les defaults du bloc http parent.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support WebSocket (Socket.io)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # Web HTTPS
    server {
        listen 443 ssl;
        server_name app.blobinfini.local;

        ssl_certificate     /etc/nginx/certs/app.blobinfini.local.pem;
        ssl_certificate_key /etc/nginx/certs/app.blobinfini.local-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10m;

        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
        }
    }
}
