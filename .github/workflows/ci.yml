name: CI

on:
  push:
    branches: [ main, develop, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgis/postgis:15-3.4
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini_shadow
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
      WEB_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install SWC binary (linux-x64-gnu)
        run: npm install --no-save @next/swc-linux-x64-gnu@14.2.7

      - name: Environment diagnostics
        run: |
          uname -a
          node -p "process.versions"
          ldd --version || true
          echo "SWC bins:"
          ls -la node_modules/@next | grep swc || true

      - name: Prepare PostGIS (create DBs + extensions)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -U postgres; do sleep 2; done
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE blobinfini;"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE blobinfini_shadow;"
          psql "postgresql://postgres:postgres@localhost:5432/blobinfini" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql "postgresql://postgres:postgres@localhost:5432/blobinfini_shadow" -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run DB migrations
        run: npm run db:migrate:deploy

      - name: Push schema to test database (ensures all tables exist)
        run: |
          cd packages/database
          npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify database tables
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/blobinfini" -c "\dt public.*" | grep -E "(User|ContactRequestResponse)" || echo "⚠️  Warning: Some tables may be missing"

      # Frontend build is now handled by Vercel (skipped in CI)
      # Uncomment the following lines if you need to test frontend builds locally with act
      # - name: Build web app
      #   if: ${{ env.ACT }}
      #   run: npm run build --workspace @blobinfini/web

      - name: Run tests (API)
        run: npm test

  type-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (api + web)
        run: npm run type-check

  web-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test --workspace @blobinfini/web

  contracts:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI specs
        run: npm run openapi:lint

  e2e-tests:
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blobinfini
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blobinfini_shadow
      SESSION_SECRET: ci-session-secret
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_BASE_URL: http://127.0.0.1:3002
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare PostGIS (create DBs + extensions)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          export PGPASSWORD=postgres
          until pg_isready -h postgres -U postgres; do sleep 2; done
          psql "postgresql://postgres:postgres@postgres:5432/postgres" -c "CREATE DATABASE blobinfini;"
          psql "postgresql://postgres:postgres@postgres:5432/postgres" -c "CREATE DATABASE blobinfini_shadow;"
          psql "postgresql://postgres:postgres@postgres:5432/blobinfini" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql "postgresql://postgres:postgres@postgres:5432/blobinfini_shadow" -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run DB migrations
        run: npm run db:migrate:deploy

      - name: Seed database
        run: npm run db:reseed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  verify-import-alias:
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: always()
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Non-bloquant: vérifie que les alias import respectent la casse (App Router casse sensible sur Linux)
      - name: Verify imports alias (case-sensitive)
        run: |
          echo "Checking for incorrect case-sensitive imports in web workspace..."
          ! git grep -n "from ['\"']@/lib/apiclient['\"']" apps/web/app
