name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build-and-test:
    name: Build and Test API
    runs-on: ubuntu-22.04
    needs: lint
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blobinfini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini_shadow
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
      WEB_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: npx wait-on tcp:localhost:5432

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Enable PostGIS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d blobinfini -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run DB migrations
        run: npm run db:migrate:deploy

      - name: Run build
        run: npm run build

      - name: Run API tests
        run: npm run test --workspace @blobinfini/api

  type-check:
    name: Type Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (api + web)
        run: npm run type-check

  web-tests:
    name: Web Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test --workspace @blobinfini/web

  contracts:
    name: API Contracts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI specs
        run: npm run openapi:lint

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blobinfini
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blobinfini_shadow
      SESSION_SECRET: ci-session-secret
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_BASE_URL: http://127.0.0.1:3002
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare PostGIS (create DBs + extensions)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          export PGPASSWORD=postgres
          until pg_isready -h postgres -U postgres; do sleep 2; done
          psql "postgresql://postgres:postgres@postgres:5432/postgres" -c "CREATE DATABASE blobinfini;"
          psql "postgresql://postgres:postgres@postgres:5432/postgres" -c "CREATE DATABASE blobinfini_shadow;"
          psql "postgresql://postgres:postgres@postgres:5432/blobinfini" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql "postgresql://postgres:postgres@postgres:5432/blobinfini_shadow" -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run DB migrations
        run: npm run db:migrate:deploy

      - name: Seed database
        run: npm run db:reseed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  verify-import-alias:
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: always()
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Non-bloquant: vérifie que les alias import respectent la casse (App Router casse sensible sur Linux)
      - name: Verify imports alias (case-sensitive)
        run: |
          echo "Checking for incorrect case-sensitive imports in web workspace..."
          ! git grep -n "from ['\"]@/lib/apiclient['\"]" apps/web/app
