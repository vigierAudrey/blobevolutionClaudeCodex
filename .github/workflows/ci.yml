name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'

jobs:
  security-guard:
    name: Security Guard - DB Push Protection
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ALLOW_ACCEPT_DATA_LOSS is not set in CI
        run: |
          echo "🔒 Checking CI environment for forbidden flags..."

          # Hard deny if ALLOW_ACCEPT_DATA_LOSS is set to true
          if [ "$ALLOW_ACCEPT_DATA_LOSS" = "true" ]; then
            echo "❌ CRITICAL SECURITY VIOLATION DETECTED!"
            echo "   ALLOW_ACCEPT_DATA_LOSS is set to 'true' in CI environment."
            echo ""
            echo "   This flag enables 'prisma db push --accept-data-loss' which can"
            echo "   result in irreversible data loss in production databases."
            echo ""
            echo "   IMMEDIATE ACTION REQUIRED:"
            echo "   - Remove ALLOW_ACCEPT_DATA_LOSS from workflow env vars"
            echo "   - Remove ALLOW_ACCEPT_DATA_LOSS from GitHub secrets"
            echo "   - Use 'prisma migrate deploy' for production deployments"
            echo ""
            exit 1
          fi

          # Check workflow files for accidental ALLOW_ACCEPT_DATA_LOSS=true assignments
          # (YAML env assignment or shell export only; ignore security guard comparisons)
          FORBIDDEN_PATTERN="^[[:space:]]*(ALLOW_ACCEPT_DATA_LOSS[[:space:]]*:[[:space:]]*(\"true\"|'true'|true)|export[[:space:]]+ALLOW_ACCEPT_DATA_LOSS[[:space:]]*=[[:space:]]*(\"true\"|'true'|true))[[:space:]]*$"
          if grep -rEn "$FORBIDDEN_PATTERN" .github/workflows/*.yml 2>/dev/null; then
            echo "❌ SECURITY VIOLATION: Found ALLOW_ACCEPT_DATA_LOSS=true in workflow files!"
            echo ""
            echo "   Detected in:"
            grep -rEn "$FORBIDDEN_PATTERN" .github/workflows/*.yml || true
            echo ""
            echo "   This flag must NEVER be set in CI workflows."
            echo "   It is only permitted in local test environments."
            echo ""
            exit 1
          fi

          echo "✅ Security check passed: No forbidden flags detected."
          echo "   ALLOW_ACCEPT_DATA_LOSS: ${ALLOW_ACCEPT_DATA_LOSS:-not set}"

  lint:
    needs: security-guard
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint (strict mode, zero warnings)
        run: pnpm run lint:strict

  build-and-test:
    name: Build and Test API
    runs-on: ubuntu-22.04
    needs: lint
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blobinfini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini_shadow
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
      WEB_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: pnpm exec wait-on tcp:localhost:5432

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Enable PostGIS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d blobinfini -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Run DB migrations
        run: pnpm run db:migrate:deploy

      - name: Run build
        run: pnpm run build

      - name: Run API tests
        run: pnpm --filter @blobinfini/api test

  type-check:
    name: Type Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check API
        run: pnpm --filter @blobinfini/api type-check

      - name: Type check Web
        continue-on-error: true
        run: pnpm --filter @blobinfini/web type-check
        # TODO: Fix web type-check (missing deps: zod, @storybook/*, unified, mdx)

  web-tests:
    name: Web Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm --filter @blobinfini/web test --detectOpenHandles

  contracts:
    name: API Contracts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI specs
        run: pnpm run openapi:lint

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blobinfini
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blobinfini_shadow
      SESSION_SECRET: ci-session-secret
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_BASE_URL: http://127.0.0.1:3002
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare PostGIS (create DBs + extensions)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          export PGPASSWORD=postgres
          until pg_isready -h postgres -U postgres; do sleep 2; done
          psql "postgresql://postgres:postgres@postgres:5432/postgres" -c "CREATE DATABASE blobinfini;"
          psql "postgresql://postgres:postgres@postgres:5432/postgres" -c "CREATE DATABASE blobinfini_shadow;"
          psql "postgresql://postgres:postgres@postgres:5432/blobinfini" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql "postgresql://postgres:postgres@postgres:5432/blobinfini_shadow" -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Run DB migrations
        run: pnpm run db:migrate:deploy

      - name: Seed database
        run: pnpm run db:reseed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e

  verify-import-alias:
    runs-on: ubuntu-22.04
    needs: build-and-test
    if: always()
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Non-bloquant: vérifie que les alias import respectent la casse (App Router casse sensible sur Linux)
      - name: Verify imports alias (case-sensitive)
        run: |
          echo "Checking for incorrect case-sensitive imports in web workspace..."
          ! git grep -n "from ['\"]@/lib/apiclient['\"]" apps/web/app
