name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # 0. Path detection (fast — no pnpm install, no Node setup)
  #    Runs in parallel with security-guard.
  #    On push/workflow_dispatch all heavy jobs run unconditionally (fallback
  #    via "github.event_name != 'pull_request'" in each job's `if:`).
  # ──────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      api:     ${{ steps.filter.outputs.api }}
      web:     ${{ steps.filter.outputs.web }}
      db:      ${{ steps.filter.outputs.db }}
      openapi: ${{ steps.filter.outputs.openapi }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # token: auto-detected from GITHUB_TOKEN — uses REST API, no extra fetch-depth
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/database/**'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
            db:
              - 'packages/database/prisma/**'
              - 'pnpm-lock.yaml'
            openapi:
              - 'docs/openapi/**'
              - 'apps/api/src/**'

  # ──────────────────────────────────────────────────────────────────────────
  # 1. Security guard — ALWAYS runs, no pnpm install
  # ──────────────────────────────────────────────────────────────────────────
  security-guard:
    name: Security Guard - DB Push Protection
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: No skipped tests in critical API suites (block)
        run: bash scripts/no-skip-critical-check.sh

      - name: No insecure logs / secrets (block)
        run: bash scripts/no-insecure-logs-check.sh

      - name: Enforce canonical security routes
        run: node scripts/check-security-routes.mjs

      - name: Forbid runtime console calls in API
        run: node scripts/check-api-runtime-console.mjs

      - name: No bare db push in CI paths (block)
        run: bash scripts/ci-block-db-push.sh

      - name: Guard — no nginx in docker-compose.vps.yml (Caddy is the official VPS proxy)
        run: bash scripts/guard-no-nginx-vps.sh

      - name: Guard — Caddyfile XFF correct ({remote_host}) et subnet VPS cohérent
        run: bash scripts/guard-caddyfile-xff.sh

      - name: Guard — no direct req.ip / x-forwarded-for access outside canonical helpers
        run: bash apps/api/scripts/no-direct-ip-access.sh

      - name: Self-test ci-block-db-push (poison pill + variantes pnpm exec/npx/unsafe/continuation)
        # Prouve que le guard bloque les formes d'invocation de db push dans un workflow.
        # Chaque fichier poison est un workflow YAML valide (name/on/jobs/steps) pour tester
        # un scénario réaliste: le guard doit bloquer même dans une structure YAML bien formée.
        run: |
          set -euo pipefail
          POISON=".github/workflows/_poison_test_$$.yml"
          trap 'rm -f "$POISON"' EXIT
          _poison_check() {
            local run_cmd="$1" label="$2"
            # Génère un workflow YAML valide contenant la commande interdite.
            printf 'name: Poison Pill\non: [push]\njobs:\n  poison:\n    runs-on: ubuntu-22.04\n    steps:\n      - name: Sneaky step\n        run: %s\n' \
              "$run_cmd" > "$POISON"
            local code=0
            bash scripts/ci-block-db-push.sh 2>&1 || code=$?
            rm -f "$POISON"
            if [ "$code" -eq 0 ]; then
              echo "❌ POISON FAILED [${label}]: ci-block-db-push.sh n'a pas bloqué"
              exit 1
            fi
            echo "✅ POISON OK [${label}]"
          }
          _poison_check "prisma db push"                                "naked"
          _poison_check "pnpm exec prisma db push"                      "pnpm-exec"
          _poison_check "npx prisma db push"                            "npx"
          _poison_check 'bash -lc "prisma db push"'                     "bash-lc"
          _poison_check 'sh -c "prisma db push"'                        "sh-c"
          _poison_check "pnpm dlx prisma db push"                       "pnpm-dlx"
          _poison_check "pnpm --filter @blobinfini/database db:push:unsafe" "db:push:unsafe"
          # Multi-line continuation bypass: guard must catch `prisma db \` at end of line
          printf 'name: Poison Pill\non: [push]\njobs:\n  poison:\n    runs-on: ubuntu-22.04\n    steps:\n      - name: Sneaky step\n        run: |\n          prisma db \\\n          push\n' \
            > "$POISON"
          code=0; bash scripts/ci-block-db-push.sh 2>&1 || code=$?
          rm -f "$POISON"
          if [ "$code" -eq 0 ]; then
            echo "❌ POISON FAILED [continuation]: multi-line db push not blocked"
            exit 1
          fi
          echo "✅ POISON OK [continuation]"

      - name: Enforce DB push guardrails
        run: bash scripts/no-unsafe-db-push-check.sh

      - name: Verify /internal/metrics is not a stub
        run: bash scripts/check-metrics-not-stub.sh

      - name: Verify Prisma supply-chain (single version in lockfile)
        # Checks pnpm-lock.yaml for unexpected prisma/@prisma/client versions.
        # pnpm.overrides in root package.json should enforce 6.19.2 everywhere.
        # Fails CI if any other version is resolved — no pnpm install required.
        run: |
          set -euo pipefail
          EXPECTED="6.19.2"
          BAD=$(grep -E "^\s*'?(prisma|@prisma/(client|config))@" pnpm-lock.yaml \
            | sed -E "s/^[[:space:]]*'?(prisma|@prisma\/(client|config))@([0-9]+\.[0-9]+\.[0-9]+).*/\3/" \
            | sort -u \
            | grep -v "^${EXPECTED}$" || true)
          if [ -n "$BAD" ]; then
            echo "❌ Unexpected Prisma version(s) in pnpm-lock.yaml:"
            echo "$BAD"
            echo "   Expected exclusively: ${EXPECTED}"
            echo "   Check pnpm.overrides in root package.json."
            exit 1
          fi
          echo "✅ Prisma supply-chain: unique version ${EXPECTED} confirmed in pnpm-lock.yaml."

      - name: Verify ALLOW_ACCEPT_DATA_LOSS is not set in CI
        run: |
          echo "🔒 Checking CI environment for forbidden flags..."

          # Hard deny if ALLOW_ACCEPT_DATA_LOSS is set to true
          if [ "$ALLOW_ACCEPT_DATA_LOSS" = "true" ]; then
            echo "❌ CRITICAL SECURITY VIOLATION DETECTED!"
            echo "   ALLOW_ACCEPT_DATA_LOSS is set to 'true' in CI environment."
            echo ""
            echo "   This flag enables 'prisma db push --accept-data-loss' which can"
            echo "   result in irreversible data loss in production databases."
            echo ""
            echo "   IMMEDIATE ACTION REQUIRED:"
            echo "   - Remove ALLOW_ACCEPT_DATA_LOSS from workflow env vars"
            echo "   - Remove ALLOW_ACCEPT_DATA_LOSS from GitHub secrets"
            echo "   - Use 'prisma migrate deploy' for production deployments"
            echo ""
            exit 1
          fi

          # Check workflow/action files for accidental ALLOW_ACCEPT_DATA_LOSS=true assignments
          # (YAML env assignment or shell export only; ignore security guard comparisons)
          # Scans .github/workflows + .github/actions recursively via rg (--no-pcre2 = Rust regex,
          # supports \b word boundary and [[:space:]] POSIX classes; preferred over grep here).
          FORBIDDEN_PATTERN='^[[:space:]]*(ALLOW_ACCEPT_DATA_LOSS[[:space:]]*:[[:space:]]*("true"|'"'"'true'"'"'|true)\b|export[[:space:]]+ALLOW_ACCEPT_DATA_LOSS[[:space:]]*=[[:space:]]*("true"|'"'"'true'"'"'|true)\b|ALLOW_ACCEPT_DATA_LOSS[[:space:]]*=[[:space:]]*("true"|'"'"'true'"'"'|true)\b)'
          ADLHITS="$(rg --no-pcre2 -rn --glob '*.yml' --glob '*.yaml' "$FORBIDDEN_PATTERN" .github/workflows .github/actions 2>/dev/null || true)"
          if [[ -n "$ADLHITS" ]]; then
            echo "❌ SECURITY VIOLATION: Found ALLOW_ACCEPT_DATA_LOSS=true in workflow files!"
            echo ""
            echo "   Detected in:"
            echo "$ADLHITS"
            echo ""
            echo "   This flag must NEVER be set in CI workflows."
            echo "   It is only permitted in local test environments."
            echo ""
            exit 1
          fi

          echo "✅ Security check passed: No forbidden flags detected."
          echo "   ALLOW_ACCEPT_DATA_LOSS: ${ALLOW_ACCEPT_DATA_LOSS:-not set}"

      - name: Booking status mutation guards (filet complémentaire — ne remplace pas la revue de code)
        run: bash scripts/check-booking-status-mutations.sh

      - name: No unguarded destructive DDL in new migrations (block)
        # Scans migration files added in this PR/push for DROP TABLE, DROP COLUMN,
        # DROP TYPE, TRUNCATE without an explicit -- DANGEROUS-DDL-APPROVED: comment.
        # Historical migrations are exempt (not retroactively checked).
        run: bash scripts/check-dangerous-migrations.sh

      - name: No unjustified SELECT 1 stubs in migrations (block)
        # All migration stubs (SELECT 1 only) must have a comment explaining why.
        # A stub without justification silently hides a missing schema object.
        run: bash scripts/check-migration-stubs.sh

      - name: No E2E anti-patterns (false greens / fragile auth) (block)
        # Blocks: loginViaApi, localStorage token storage, waitForTimeout,
        # .divide-y selectors, conditional count() assertions, addCookies in specs.
        # Inline "// e2e-lint-ok" suppresses a single flagged line.
        run: bash scripts/check-e2e-antipatterns.sh

      - name: AuthZ route guard — no sensitive routes without explicit guard (block)
        # Scans pro.controller.ts and profile.controller.ts for sensitive routes
        # (POST/PUT/PATCH/DELETE or paths containing delete/photo/export/disciplines/me/near/lessons)
        # without requireProRole, requireRiderRole, requireRole(...), or // authz-guard-ok: <reason>.
        # Catches silent AuthZ regressions when a new route is added without a guard.
        run: bash scripts/check-authz-route-guards.sh

      - name: Self-test check-authz-route-guards (poison pill)
        # Proves the guard blocks an unguarded sensitive route and accepts a valid annotation.
        run: |
          set -euo pipefail
          TMPFILE="$(mktemp /tmp/authz_poison_XXXXXX.ts)"
          trap 'rm -f "$TMPFILE"' EXIT

          # Poison files use profileRouter to match the guard's router pattern.
          # AUTHZ_OVERRIDE_FILES redirects the script to scan only the temp file.

          # ── Test 1: unguarded sensitive route → must FAIL ────────────────────
          printf 'const profileRouter = { post: () => {} };\nprofileRouter.post("/delete-account", async (req, res) => {\n});\n' > "$TMPFILE"
          code=0
          AUTHZ_OVERRIDE_FILES="$TMPFILE" bash scripts/check-authz-route-guards.sh 2>&1 || code=$?
          if [ "$code" -eq 0 ]; then
            echo "❌ POISON FAILED: guard did not block unguarded POST /delete-account" >&2
            exit 1
          fi
          echo "✅ POISON OK [unguarded sensitive route blocked]"

          # ── Test 2: annotated exception with justification → must PASS ───────
          printf 'const profileRouter = { post: () => {} };\nprofileRouter.post("/delete-account", async (req, res) => { // authz-guard-ok: test-only justification\n});\n' > "$TMPFILE"
          AUTHZ_OVERRIDE_FILES="$TMPFILE" bash scripts/check-authz-route-guards.sh
          echo "✅ POISON OK [annotated exception accepted]"

          # ── Test 3: annotation without justification → must FAIL ─────────────
          printf 'const profileRouter = { post: () => {} };\nprofileRouter.post("/delete-account", async (req, res) => { // authz-guard-ok:\n});\n' > "$TMPFILE"
          code=0
          AUTHZ_OVERRIDE_FILES="$TMPFILE" bash scripts/check-authz-route-guards.sh 2>&1 || code=$?
          if [ "$code" -eq 0 ]; then
            echo "❌ POISON FAILED: guard accepted authz-guard-ok annotation without justification" >&2
            exit 1
          fi
          echo "✅ POISON OK [empty authz-guard-ok rejected]"

      - name: Caddy syntax guard — forbid {env.VAR} in Caddyfiles (block)
        # {env.VAR} is treated literally by Caddy in site addresses and global block
        # options — certificates are issued for the literal string, causing TLS failure.
        # Only {$VAR} (parse-time substitution) is valid in those contexts.
        # Root cause of confirmed production outage (Cloudflare 521, 2026-05-25).
        run: bash scripts/check-caddy-syntax.sh docker/

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Lint — ALWAYS runs
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    needs: security-guard
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enforce network guardrails
        run: bash scripts/no-raw-fetch-check.sh

      # no-insecure-logs-check.sh already ran in security-guard (which we depend on).
      # Removed here to avoid duplicating ~30s of grep across the lockfile.

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint (strict mode, zero warnings)
        run: pnpm run lint:strict

  # ──────────────────────────────────────────────────────────────────────────
  # 3. API Unit Tests (fast — no Postgres) — ALWAYS runs
  # ──────────────────────────────────────────────────────────────────────────
  api-unit-fast:
    name: API Unit Tests (fast — no Postgres)
    runs-on: ubuntu-22.04
    needs: [security-guard]
    timeout-minutes: 8
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=2048
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
      IP_HASH_SECRET: test-ip-hash-secret-for-ci-only-min-32-chars
      LOG_ACTOR_SECRET: test-log-actor-secret-for-ci-only-min-32-chars
      WEB_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # Required for @blobinfini/database imports to resolve — does NOT need a running DB.
        run: pnpm run db:generate

      - name: Run unit tests (no Postgres, no Redis)
        run: |
          pnpm --filter @blobinfini/api exec jest \
            --config jest.unit.config.cjs \
            --no-coverage \
            --forceExit \
            --detectOpenHandles

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Type Check API — ALWAYS runs (no Next.js build needed)
  # ──────────────────────────────────────────────────────────────────────────
  type-check-api:
    name: Type Check API
    runs-on: ubuntu-22.04
    needs: [security-guard]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check API
        run: pnpm --filter @blobinfini/api type-check

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Type Check Web — conditional: web files changed OR push/dispatch
  #    Expensive: requires a full Next.js build to generate .next/types.
  # ──────────────────────────────────────────────────────────────────────────
  type-check-web:
    name: Type Check Web
    runs-on: ubuntu-22.04
    needs: [security-guard, changes]
    timeout-minutes: 25
    if: needs.changes.outputs.web == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web (prepare .next/types)
        run: pnpm --filter @blobinfini/web build

      - name: Type check Web
        run: pnpm --filter @blobinfini/web type-check

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Build and Test API — conditional: API/DB files changed OR push/dispatch
  # ──────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test API
    runs-on: ubuntu-22.04
    needs: [lint, changes]
    timeout-minutes: 40
    if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blobinfini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini_shadow
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
      IP_HASH_SECRET: test-ip-hash-secret-for-ci-only-min-32-chars
      LOG_ACTOR_SECRET: test-log-actor-secret-for-ci-only-min-32-chars
      WEB_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres to be ready
        # Boucle explicite pg_isready (30s timeout) — ne pas supposer que le healthcheck
        # du service container suffit: il certifie l'état du conteneur, pas la disponibilité
        # TCP du port ni la capacité à accepter des requêtes applicatives.
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          deadline=$((SECONDS + 30))
          until pg_isready -h localhost -U postgres -d blobinfini; do
            if [ $SECONDS -ge $deadline ]; then
              echo "❌ Postgres not ready after 30s — aborting." >&2
              exit 1
            fi
            sleep 1
          done
          echo "✅ Postgres TCP ready."
          # Verify applicative readiness: auth + correct DB via DATABASE_URL.
          # pg_isready only certifies TCP; this proves the credentials work.
          psql "$DATABASE_URL" -c "select 1" > /dev/null
          echo "✅ Postgres auth ready (DATABASE_URL)."

      - name: Canary DB clean replay
        run: pnpm --filter @blobinfini/database migrate:test:clean

      - name: Enable PostGIS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d blobinfini -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Preflight DB migration state (allow pending before deploy)
        run: pnpm run db:preflight:allow-pending

      - name: Run DB migrations
        run: pnpm run db:migrate:deploy

      - name: Preflight DB schema lockstep (strict after deploy)
        run: pnpm run db:preflight

      - name: Verify DB constraints (EXCLUSION CONSTRAINT + UNIQUE INDEX)
        # Proves that migrate deploy produced the business-critical constraints
        # (not just that migrations ran — but that the actual schema objects exist).
        # Also activates the Jest globalSetup CI guard via JEST_DB_PREPARED=true below.
        run: node scripts/check-btree-gist.mjs --verify-constraints

      - name: Run build
        run: pnpm run build

      - name: Run API tests
        # JEST_DB_PREPARED=true: migrations ran above; Jest must not run db push.
        env:
          JEST_DB_PREPARED: 'true'
        run: pnpm --filter @blobinfini/api test

      - name: Fail on ERL runtime regression signature in logs
        run: bash scripts/check-no-erl-runtime-log.sh

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Migration Chain — conditional: DB/Prisma files changed OR push/dispatch
  #    Only Prisma schema or lockfile changes warrant a fresh migration replay.
  # ──────────────────────────────────────────────────────────────────────────
  migrate-deploy-fresh:
    # Rejoue prisma migrate deploy sur DB vide — bloquant.
    # Garantit que la chaîne de migration est valide pour tout nouveau déploiement.
    # Historique : était advisory (continue-on-error: true) avant 2026-04-03 ; rendu
    # bloquant après résolution du drift Prisma (runbook: docs/runbooks/prisma-migration-drift-2026-03.md).
    name: Migration Chain — Fresh DB Deploy
    runs-on: ubuntu-22.04
    needs: [lint, changes]
    timeout-minutes: 20
    if: needs.changes.outputs.db == 'true' || github.event_name != 'pull_request'
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blobinfini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres to be ready
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          deadline=$((SECONDS + 30))
          until pg_isready -h localhost -U postgres -d blobinfini; do
            if [ $SECONDS -ge $deadline ]; then
              echo "❌ Postgres not ready after 30s — aborting." >&2
              exit 1
            fi
            sleep 1
          done
          echo "✅ Postgres ready."

      - name: Run full migration chain on empty DB
        run: pnpm --filter @blobinfini/database migrate:test:derived

      - name: Verify schema.prisma ↔ migration chain (prisma migrate diff)
        # Compares what the migrations produced (DATABASE_URL) against what
        # schema.prisma declares. Exit 2 = drift exists = CI fails.
        #
        # This catches the most dangerous case: schema.prisma was modified
        # without running prisma migrate dev (no migration generated).
        # On a fresh DB the migrations run fine but schema.prisma declares
        # objects that don't exist in any migration file.
        #
        # Also catches: migration SQL that doesn't match what Prisma generated
        # (hand-edited migration diverging from schema.prisma intent).
        working-directory: packages/database
        run: |
          set -euo pipefail
          echo "⏳ Comparing deployed DB schema vs schema.prisma..."
          # --exit-code: exit 0 = no diff, exit 1 = error, exit 2 = diff exists.
          # --script: output SQL so the diff is visible in CI logs on failure.
          # IMPORTANT: set +e before the command — with set -e active, a non-zero exit
          # from a command substitution aborts the script before we can capture $?.
          set +e
          DIFF_SQL=$(npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
            --script 2>&1)
          DRIFT_EXIT=$?
          set -e
          if [ "$DRIFT_EXIT" -eq 2 ]; then
            echo "❌ SCHEMA DRIFT DETECTED"
            echo ""
            echo "   The deployed migration chain does not produce the schema declared in schema.prisma."
            echo "   Scenario: schema.prisma was modified without running 'prisma migrate dev'."
            echo ""
            echo "   SQL needed to bring DB to match schema.prisma:"
            echo "$DIFF_SQL"
            echo ""
            echo "   Fix: run 'pnpm --filter @blobinfini/database migrate' to generate the missing migration."
            echo "   NEVER fix with db push or psql direct."
            exit 1
          elif [ "$DRIFT_EXIT" -ne 0 ]; then
            echo "❌ prisma migrate diff command failed (exit $DRIFT_EXIT)"
            echo "$DIFF_SQL"
            exit 1
          fi
          echo "✅ Schema sync confirmed: deployed DB matches schema.prisma."
          echo ""
          echo "NOTE: this check detects schema.prisma changes without migrations."
          echo "It does NOT detect db push drift on an existing local DB (fundamental CI limitation)."

  # ──────────────────────────────────────────────────────────────────────────
  # 8. Socket Tests — conditional: API/DB files changed OR push/dispatch
  # ──────────────────────────────────────────────────────────────────────────
  socket-tests:
    name: Socket Tests
    runs-on: ubuntu-22.04
    needs: [security-guard, changes]
    timeout-minutes: 20
    if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
    # Dedicated Postgres — isolated from build-and-test (separate runner).
    # Each job runs on its own GitHub Actions runner: port 5432 here is NOT
    # shared with the build-and-test job's postgres service.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blobinfini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini_shadow
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
      IP_HASH_SECRET: test-ip-hash-secret-for-ci-only-min-32-chars
      LOG_ACTOR_SECRET: test-log-actor-secret-for-ci-only-min-32-chars
      WEB_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres to be ready
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          deadline=$((SECONDS + 30))
          until pg_isready -h localhost -U postgres -d blobinfini; do
            if [ $SECONDS -ge $deadline ]; then
              echo "❌ Postgres not ready after 30s — aborting." >&2
              exit 1
            fi
            sleep 1
          done
          echo "✅ Postgres TCP ready."
          psql "$DATABASE_URL" -c "select 1" > /dev/null
          echo "✅ Postgres auth ready (DATABASE_URL)."

      - name: Enable PostGIS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d blobinfini -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Run DB migrations
        run: pnpm run db:migrate:deploy

      - name: Run socket tests
        # --runInBand: belt-and-suspenders with maxWorkers:1 in jest.socket.config.cjs.
        # Socket tests bind fixed ports and share in-process rate-limiter state —
        # parallel execution would cause port conflicts and flaky failures.
        env:
          JEST_DB_PREPARED: 'true'
        run: |
          pnpm --filter @blobinfini/api exec jest \
            --config jest.socket.config.cjs \
            --runInBand \
            --no-coverage \
            --forceExit \
            --detectOpenHandles

  # ──────────────────────────────────────────────────────────────────────────
  # 9. Web Tests — conditional: web files changed OR push/dispatch
  # ──────────────────────────────────────────────────────────────────────────
  web-tests:
    name: Web Tests
    runs-on: ubuntu-22.04
    needs: [security-guard, changes]
    timeout-minutes: 10
    if: needs.changes.outputs.web == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm --filter @blobinfini/web test --detectOpenHandles

  # ──────────────────────────────────────────────────────────────────────────
  # 10. API Contracts — conditional: openapi/api files changed OR push/dispatch
  # ──────────────────────────────────────────────────────────────────────────
  contracts:
    name: API Contracts
    runs-on: ubuntu-22.04
    needs: [security-guard, changes]
    timeout-minutes: 8
    if: needs.changes.outputs.openapi == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI specs
        run: pnpm run openapi:lint

  # ──────────────────────────────────────────────────────────────────────────
  # 11. E2E Tests — push to main or workflow_dispatch ONLY
  #     Never runs on pull_request (too expensive: 30 min + Playwright + Postgres).
  #     Trigger manually via workflow_dispatch for pre-merge validation.
  #     Previously ran on PRs targeting main — removed to save ~30 min/PR.
  # ──────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    services:
      # Mailpit reste en CI pour les scénarios E2E de capture d'email locale.
      # Ce job ne valide pas la parité SMTP VPS/Brevo.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        # Aligned with build-and-test and migrate-deploy-fresh (was postgis:15-3.4).
        # PostGIS SQL behaviour is identical across 15/16 for our usage; harmonizing
        # eliminates a class of "passes E2E but fails unit" surprises on PostGIS API diffs.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # Port mapping requis : job sans container — le runner accède au service via localhost.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini_shadow
      SESSION_SECRET: ci-session-secret
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      IP_HASH_SECRET: ci-ip-hash-secret-for-e2e-only-min-32-chars
      LOG_ACTOR_SECRET: ci-log-actor-secret-for-e2e-only-min-32-chars
      EMAIL_HASH_SECRET: ci-email-hash-secret-for-e2e-only-min-32-chars
      MAILPIT_URL: http://localhost:8025
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4020
      WEB_BASE_URL: http://127.0.0.1:3020
      NEXT_PUBLIC_ADSENSE_ENABLED: 'false'
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: 'ca-pub-0000000000000000'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare PostGIS (create DBs + extensions)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          export PGPASSWORD=postgres
          # Timeout augmenté à 60s : postgis/postgis:15-3.4 peut être lent à démarrer.
          deadline=$((SECONDS + 60))
          until pg_isready -h localhost -U postgres; do
            if [ $SECONDS -ge $deadline ]; then
              echo "❌ Postgres not ready after 60s — aborting." >&2
              exit 1
            fi
            sleep 2
          done
          echo "✅ Postgres TCP ready."
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "select 1" > /dev/null
          echo "✅ Postgres auth ready."
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE blobinfini;"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE blobinfini_shadow;"
          psql "postgresql://postgres:postgres@localhost:5432/blobinfini" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql "postgresql://postgres:postgres@localhost:5432/blobinfini_shadow" -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Run DB migrations
        run: pnpm run db:migrate:deploy

      - name: Seed database
        run: pnpm run db:reseed

      - name: Build Web (bake NEXT_PUBLIC_API_URL for next start)
        # CI Playwright serves the production build with next start; this avoids
        # lazy route/chunk compilation delaying the Leaflet dynamic import.
        run: pnpm --filter @blobinfini/web build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ADSENSE_ENABLED: ${{ env.NEXT_PUBLIC_ADSENSE_ENABLED }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ env.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Invalidate when pnpm-lock.yaml changes (Playwright version bump).
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browsers
        # chromium only — the project's playwright.config.ts uses a single chromium project.
        # --with-deps always installs OS-level browser dependencies (not cached).
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e

  # ──────────────────────────────────────────────────────────────────────────
  # 12. Verify Import Alias — lightweight standalone (no pnpm install)
  #     Moved from needs:build-and-test → needs:security-guard so it runs
  #     early, in parallel with lint, instead of at the very end of the chain.
  # ──────────────────────────────────────────────────────────────────────────
  verify-import-alias:
    runs-on: ubuntu-22.04
    needs: security-guard
    if: always()
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Non-bloquant: vérifie que les alias import respectent la casse (App Router casse sensible sur Linux)
      - name: Verify imports alias (case-sensitive)
        run: |
          echo "Checking for incorrect case-sensitive imports in web workspace..."
          ! git grep -n "from ['\"]@/lib/apiclient['\"]" apps/web/app
