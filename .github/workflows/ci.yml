name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blobinfini
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blobinfini
      JWT_SECRET: test-jwt-secret
      SESSION_SECRET: test-session-secret
      REDIS_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database schema
        run: npm run db:migrate:deploy

      - name: Seed database
        run: npm run seed --workspace @blobinfini/database

      - name: Lint OpenAPI schema
        run: npm run openapi:lint

      - name: Check exchange naming
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const base = path.join('ai', 'exchange');
          const patterns = {
            requests: /^\d{8}-\d{4}-[a-z0-9-]+\.md$/,
            proposals: /^\d{8}-\d{4}-[a-z0-9-]+(\.diff|\.md)$/,
          };

          let hasError = false;

          for (const dir of Object.keys(patterns)) {
            const target = path.join(base, dir);
            if (!fs.existsSync(target)) continue;
            for (const entry of fs.readdirSync(target)) {
              if (entry.startsWith('_') || entry === '.gitkeep') continue;
              if (!patterns[dir].test(entry)) {
                console.error(`Nom de fichier invalide dans ${dir}: ${entry}`);
                hasError = true;
              }
            }
          }

          if (hasError) process.exit(1);
          NODE

      - name: Lint (web)
        run: npm run lint --workspace @blobinfini/web

      - name: Type check (monorepo)
        run: npm run type-check

      - name: Test API
        run: npm run test --workspace @blobinfini/api -- --runInBand

      - name: Test Web
        run: npm run test --workspace @blobinfini/web -- --runInBand
        continue-on-error: true

      - name: Storybook visual tests
        run: npm run storybook:test
