services:
  postgres:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blobinfini
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blobinfini
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: npm run dev:api

  e2e-server:
    build:
      context: .
      dockerfile: docker/e2e.Dockerfile
    command: npm run test:e2e
    environment:
      NODE_ENV: test
      DATABASE_URL: ${DATABASE_URL_TEST:-postgresql://postgres:postgres@postgres:5432/blobinfini}
      E2E_WEB_PORT: 3020
      E2E_API_PORT: 4020
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3020:3020"
      - "4020:4020"
    volumes:
      - .:/workspace
    working_dir: /workspace

volumes:
  pgdata:
  miniodata:
  redis-data:
