services:
  postgres:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blobinfini
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    command:
      - "redis-server"
      - "--appendonly"
      - "no"  # Cache/rate-limit/2FA are ephemeral (no persistence needed)
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "256mb"  # Limit memory usage
      - "--maxmemory-policy"
      - "allkeys-lru"  # Evict least recently used keys when full
      - "--save"
      - ""  # Disable RDB snapshots (no persistence)
    # Local dev on host expects Redis on localhost:6379 for rate limiting/caching.
    # Bind to loopback only so it stays inaccessible from the network.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data  # Volume kept for compatibility but won't be used
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blobinfini
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      SMTP_HOST: mailpit
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: "http://localhost:${MINIO_HOST_PORT:-9000}"
      S3_PUBLIC_URL_BASE: "http://localhost:${MINIO_HOST_PORT:-9000}/blobinfini-dev"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3010,http://localhost:3011}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: npm run dev:api

  e2e-server:
    build:
      context: .
      dockerfile: docker/e2e.Dockerfile
    command: npm run test:e2e
    environment:
      NODE_ENV: test
      DATABASE_URL: ${DATABASE_URL_TEST:-postgresql://postgres:postgres@postgres:5432/blobinfini}
      E2E_WEB_PORT: 3020
      E2E_API_PORT: 4020
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3020:3020"
      - "4020:4020"
    volumes:
      - .:/workspace
    working_dir: /workspace

  api-cron:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.cron
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blobinfini
      NODE_ENV: production
      SMTP_HOST: mailpit
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: "http://localhost:${MINIO_HOST_PORT:-9000}"
      S3_PUBLIC_URL_BASE: "http://localhost:${MINIO_HOST_PORT:-9000}/blobinfini-dev"
    volumes:
      - ./apps/api/logs:/app/apps/api/logs
    networks:
      - default

volumes:
  pgdata:
  miniodata:
  redis-data:
