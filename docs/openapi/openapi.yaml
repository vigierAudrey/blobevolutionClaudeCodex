        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BlobospherePost'
                - type: object
                  properties:
                    newSlug:
                      type: string
                    newCategory:
                      type: string
                      enum: [surf, kitesurf, communaute, impact]
