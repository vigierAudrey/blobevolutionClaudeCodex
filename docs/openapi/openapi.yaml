  /contact/request:
    post:
      tags: [Contact]
      summary: Un pro demande l'autorisation de contacter un rider
      operationId: contactRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId]
              additionalProperties: false
              properties:
                conversationId:
                  type: string
                  format: uuid
                message:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Demande créée
          content:
            application/json:
              schema:
                type: object
                required: [success, contactRequest]
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                  contactRequest:
                    type: object
                    additionalProperties: false
                    required: [id, message, proName, createdAt]
                    properties:
                      id:
                        type: string
                        format: uuid
                      message:
                        type: string
                        nullable: true
                        maxLength: 500
                      proName:
                        type: string
                        description: businessName du pro ou "Professionnel" en fallback
                      createdAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Une demande de contact existe déjà pour cette conversation
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: Contact request already exists for this conversation
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contact/respond:
    post:
      tags: [Contact]
      summary: Un rider répond à la demande d'un pro
      operationId: contactRespond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactRequestId:
                  type: string
                  format: uuid
                response:
                  type: string
                  enum: [ACCEPT, REJECT]
      responses:
        '200':
          description: Réponse enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [success, status, message]
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    enum: [PENDING, ACCEPTED, REJECTED]
                    description: >
                      État final de la demande après cette réponse. ACCEPTED signifie
                      "mise en relation ouverte" : le pro est autorisé à rejoindre la
                      conversation. Ce n'est pas une réservation ni un cours accepté.
                  message:
                    type: string
                    description: Message lisible décrivant l'état
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Conflit — trois cas possibles selon `error` :
            - `ALREADY_RESPONDED` : le rider a déjà voté pour cette demande (vote immuable)
            - `CONTACT_REQUEST_ALREADY_RESOLVED` : la demande est déjà ACCEPTED ou REJECTED ; `status` indique l'état final
            - `CONCURRENT_UPDATE` : échec de sérialisation transitoire (P2034) — retryable
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum:
                      - ALREADY_RESPONDED
                      - CONTACT_REQUEST_ALREADY_RESOLVED
                      - CONCURRENT_UPDATE
                  status:
                    type: string
                    enum: [ACCEPTED, REJECTED]
                    description: Présent uniquement pour CONTACT_REQUEST_ALREADY_RESOLVED
                  message:
                    type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contact/requests:
