        connectedContacts:
          type: integer
          description: >
            Mises en relation ouvertes sur 7 jours. Source technique :
            ContactRequest.status = ACCEPTED.
        pendingContacts:
          type: integer
          description: Demandes de contact encore en attente de réponse rider.
        connectionRate:
          type: number
          nullable: true
          description: connectedContacts / sentContacts * 100, null si sentContacts = 0.
        conversationsStartedCount:
          type: integer
          description: >
            Mises en relation acceptées ayant au moins un message réel après
            acceptation. Les messages vides/blancs et les contenus système ne
            sont pas comptés.
        conversationStartRate:
          type: number
          nullable: true
          description: conversationsStartedCount / connectedContacts * 100, null si connectedContacts = 0.
        acceptedContacts:
          type: integer
          deprecated: true
          description: Alias rétrocompatible de connectedContacts.
        acceptanceRate:
          type: number
          nullable: true
          deprecated: true
          description: Alias rétrocompatible de connectionRate.
