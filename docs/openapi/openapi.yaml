  /admin/blobosphere/posts:
    get:
      tags: [Admin]
      summary: Liste les articles MDX (métadonnées)
      operationId: adminBlobosphereList
      responses:
        '200':
          description: Liste des fichiers MDX présents dans le repo
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                          enum: [surf, kitesurf, communaute, impact]
                        file:
                          type: string
                        slug:
                          type: string
                        title:
                          type: string
                        status:
                          type: string
                        publishedAt:
                          type: string
                          nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Crée un article MDX
      operationId: adminBlobosphereCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlobospherePost'
      responses:
        '201':
          description: Article créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  path:
                    type: string
                  pr:
                    type: object
                    nullable: true
                    properties:
                      prUrl:
                        type: string
                      prNumber:
                        type: integer
                      branchName:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/blobosphere/posts/{category}/{slug}:
    get:
      tags: [Admin]
      summary: Récupère un article MDX brut
      operationId: adminBlobosphereGet
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
            enum: [surf, kitesurf, communaute, impact]
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fichier MDX brut
          content:
            application/json:
              schema:
                type: object
                properties:
                  raw:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin]
      summary: Met à jour un article MDX
      operationId: adminBlobosphereUpdate
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
            enum: [surf, kitesurf, communaute, impact]
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BlobospherePost'
                - type: object
                  properties:
                    newSlug:
                      type: string
                    newCategory:
                      type: string
                      enum: [surf, kitesurf, communaute, impact]
      responses:
        '200':
          description: Article mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  path:
                    type: string
                  pr:
                    type: object
                    nullable: true
                    properties:
                      prUrl:
                        type: string
                      prNumber:
                        type: integer
                      branchName:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BlobospherePost:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        category:
          type: string
          enum: [surf, kitesurf, communaute, impact]
        tags:
          type: array
          items:
            type: string
        excerpt:
          type: string
        status:
          type: string
          enum: [draft, published]
        publishedAt:
          type: string
        updatedAt:
          type: string
          nullable: true
        coverImage:
          type: string
          nullable: true
        readingTime:
          type: integer
          nullable: true
        language:
          type: string
          enum: [fr]
        body:
          type: string
    GdprPurgeTechnicalStats:
      type: object
      properties:
        sessionsDeleted:
          type: integer
        tokensDeleted:
          type: integer
        oldLogsDeleted:
          type: integer
    GdprPurgeUserStats:
      type: object
      properties:
        phase1Anonymized:
          type: integer
        phase2Anonymized:
          type: integer
        phase3Purged:
          type: integer
    GdprPurgeRelationalStats:
      type: object
      properties:
        conversationsDeleted:
          type: integer
        matchesDeleted:
          type: integer
        oldSearchesDeleted:
          type: integer
    GdprPurgeResponse:
      type: object
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        durationMs:
          type: integer
        message:
          type: string
        result:
          type: object
          properties:
            summary:
              type: string
            technicalData:
              $ref: '#/components/schemas/GdprPurgeTechnicalStats'
            userAnonymization:
              $ref: '#/components/schemas/GdprPurgeUserStats'
            relationalData:
              $ref: '#/components/schemas/GdprPurgeRelationalStats'
  responses:
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Erreur de validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InternalError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Limite de requêtes atteinte
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          description: Informations supplémentaires (validation, etc.)
      additionalProperties: true
    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: Invalid input
        details:
          type: array
          items:
            type: object
            additionalProperties: true
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        requiresTwoFactor:
          type: boolean
      required: [accessToken, refreshToken, expiresIn]
    RegisterRequest:
      type: object
      required: [email, password, consentAccepted]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          description: Rôle public sélectionné lors de l'inscription (les comptes ADMIN sont gérés en interne)
          enum: [RIDER, PRO]
          default: RIDER
        consentAccepted:
          type: boolean
          const: true
    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        requiresEmailVerification:
          type: boolean
          default: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        consentAccepted:
          type: boolean
          description: Confirmation de la charte RGPD
    LoginResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          properties:
            requiresTwoFactor:
              type: boolean
              const: true
            twoFactorDelivery:
              type: string
              enum: [EMAIL]
          required: [requiresTwoFactor, twoFactorDelivery]
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      properties:
        allDevices:
          type: boolean
          default: true
        refreshToken:
          type: string
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
    TwoFactorSendRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    TwoFactorVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        riderProfile:
          $ref: '#/components/schemas/Profile'
        proProfile:
          $ref: '#/components/schemas/ProProfile'
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        bio:
          type: string
        sex:
          type: string
          enum: [FEMALE, MALE, OTHER, UNSPECIFIED]
        maxDistanceKm:
          type: integer
        emailNotif:
          type: boolean
        wantsLesson:
          type: boolean
        lessonSport:
          type: string
          enum: [surf, kitesurf]
        lessonLevel:
          type: string
          enum: [beginner, intermediate, advanced]
          nullable: true
        lessonDate:
          type: string
          format: date-time
          nullable: true
        lessonPlace:
          type: string
          nullable: true
        lessonStudentCount:
          type: integer
          minimum: 1
          nullable: true
        blobosphereContributor:
          type: boolean
        lat:
          type: number
        lng:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    ProfileUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        sex:
          type: string
          enum: [FEMALE, MALE, OTHER, UNSPECIFIED]
        maxDistanceKm:
          type: integer
        emailNotif:
          type: boolean
        photoUrl:
          type: string
          format: uri
        lat:
          type: number
        lng:
          type: number
        wantsLesson:
          type: boolean
        lessonSport:
          type: string
          enum: [surf, kitesurf]
        lessonLevel:
          type: string
          enum: [beginner, intermediate, advanced]
          nullable: true
        lessonDate:
          type: string
          format: date-time
          nullable: true
        lessonPlace:
          type: string
          nullable: true
        lessonStudentCount:
          type: integer
          minimum: 1
          nullable: true
        blobosphereContributor:
          type: boolean
    Discipline:
      type: object
      required: [sport, level]
      properties:
        sport:
          type: string
          enum: [surf, kitesurf]
        level:
          type: string
          enum: [beginner, intermediate, advanced]
    PresignedUploadResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
        key:
          type: string
        fileUrl:
          type: string
          format: uri
    ProProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        businessName:
          type: string
        bio:
          type: string
        emailNotif:
          type: boolean
        photoUrl:
          type: string
          format: uri
        lat:
          type: number
        lng:
          type: number
        radiusKm:
          type: integer
          minimum: 1
          maximum: 200
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    ProProfileUpdateRequest:
      type: object
      properties:
        businessName:
          type: string
        bio:
          type: string
        emailNotif:
          type: boolean
        photoUrl:
          type: string
          format: uri
        lat:
          type: number
        lng:
          type: number
        radiusKm:
          type: integer
          minimum: 1
          maximum: 200
    LessonLead:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        lat:
          type: number
        lng:
          type: number
        distanceKm:
          type: number
        lessonSport:
          type: string
          enum: [surf, kitesurf]
          nullable: true
        lessonLevel:
          type: string
          enum: [beginner, intermediate, advanced]
          nullable: true
        lessonDate:
          type: string
          format: date-time
          nullable: true
        lessonPlace:
          type: string
          nullable: true
        lessonStudentCount:
          type: integer
          minimum: 1
          nullable: true
    ProOffer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        proProfileId:
          type: string
          format: uuid
        sport:
          type: string
        level:
          type: string
        title:
          type: string
        description:
          type: string
        hourlyRate:
          type: number
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProOfferInput:
      type: object
      required: [sport, level, title, description, hourlyRate]
      properties:
        sport:
          type: string
          enum: [surf, kitesurf]
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        title:
          type: string
        description:
          type: string
        hourlyRate:
          type: number
        isActive:
          type: boolean
    ProOfferSummary:
      allOf:
        - $ref: '#/components/schemas/ProOffer'
        - type: object
          properties:
            distanceKm:
              type: number
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      additionalProperties: true
    MatchingSearchRequest:
      type: object
      required: [sport, level, date]
      properties:
        sport:
          type: string
          enum: [surf, kitesurf]
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        date:
          type: string
          description: Date au format YYYY-MM-DD ou "anytime"
        distanceKm:
          type: integer
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        cursor:
          type: string
          description: ID de profil pour pagination
        limit:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        sortBy:
          type: string
          enum: [distance, name]
        excludeIds:
          type: array
          items:
            type: string
    MatchingSearchResponse:
      type: object
      properties:
        criteria:
          type: object
          additionalProperties: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/MatchingResult'
        total:
          type: integer
        hasMore:
          type: boolean
        nextCursor:
          type: string
    MatchingResult:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        gender:
          type: string
        sport:
          type: string
        level:
          type: string
        distanceKm:
          type: number
    MatchingDecision:
      type: object
      required: [targetProfileId, decision]
      properties:
        targetProfileId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [ACCEPT, REFUSE]
    MatchingBatchDecisions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/MatchingDecision'
    CreatedConversation:
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        otherDisplayName:
          type: string
    AvailabilityInput:
      type: object
      required:
        - start
        - end
        - spotName
      properties:
