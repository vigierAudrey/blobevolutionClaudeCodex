                      enum: [surf, kitesurf, communaute, impact]
      responses:
        '200':
          description: Article mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  path:
                    type: string
                  pr:
                    type: object
                    nullable: true
                    properties:
                      prUrl:
                        type: string
                      prNumber:
                        type: integer
                      branchName:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications:
    get:
      tags: [Notifications]
      summary: Liste paginée des notifications
      description: |
        Retourne les notifications de l'utilisateur authentifié, triées par `createdAt` DESC.
        Pagination par curseur (ISO-8601 du dernier `createdAt` reçu).
        La valeur de `limit` est **clampée à 50 côté serveur** : envoyer `limit=100` retourne 200
        avec au plus 50 items (pas de 400). Valeurs négatives ou nulles → 400.
      operationId: notificationsList
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            format: date-time
          description: ISO-8601 avec offset — `createdAt` du dernier item reçu
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
            description: Nombre d'items demandés — clampé à 50 côté serveur
      responses:
        '200':
          description: Liste de notifications
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationItem'
                  nextCursor:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Nombre de notifications non lues (badge)
      operationId: notificationsUnreadCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Compte des notifications non lues
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Marque une notification comme lue (idempotent)
      description: |
        Opération idempotente et IDOR-safe : le `WHERE` inclut `userId` côté serveur.
        Un appel sur l'ID d'une notification appartenant à un autre utilisateur retourne 200
        sans effet (pas de 404 pour éviter l'énumération).
      operationId: notificationMarkRead
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Notification marquée lue (ou déjà lue)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Marque toutes les notifications non lues comme lues
      description: |
        Scoped strictement à l'utilisateur authentifié — n'affecte pas les autres utilisateurs.
      operationId: notificationsReadAll
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Toutes les notifications marquées lues
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    securityMonitorToken:
      type: apiKey
      in: header
      name: X-Security-Monitor-Token
  responses:
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Erreur de validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InternalError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Limite de requêtes atteinte
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SecurityHealthCheckState:
      type: string
      enum: [ok, fail]
    SecurityHealthStatus:
      type: string
      enum: [SECURE, DEGRADED, UNSAFE]
    SecurityHealthChecks:
      type: object
      required: [config, env, db, redis, smtp]
      properties:
        config:
          $ref: '#/components/schemas/SecurityHealthCheckState'
        env:
          $ref: '#/components/schemas/SecurityHealthCheckState'
        db:
          $ref: '#/components/schemas/SecurityHealthCheckState'
        redis:
          $ref: '#/components/schemas/SecurityHealthCheckState'
        smtp:
          $ref: '#/components/schemas/SecurityHealthCheckState'
    SecurityHealthResponse:
      type: object
      required: [status, timestamp, checks]
      properties:
        status:
          $ref: '#/components/schemas/SecurityHealthStatus'
        timestamp:
          type: string
          format: date-time
        checks:
          $ref: '#/components/schemas/SecurityHealthChecks'
    SecurityObservabilityStatus:
      type: string
      enum: [healthy, degraded, failing]
    SecurityBreakerState:
      type: string
      enum: [closed, open, half-open]
    SecurityObservabilityPipeline:
      type: object
      required: [queued, sent, dropped, failed, breakerState]
      properties:
        queued:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
        dropped:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        breakerState:
          $ref: '#/components/schemas/SecurityBreakerState'
    SecurityEmailLatency:
      type: object
      required: [p50, p95, p99]
      properties:
        p50:
          type: integer
          minimum: 0
        p95:
          type: integer
          minimum: 0
        p99:
          type: integer
          minimum: 0
    SecurityEmailMetrics:
      type: object
      required: [email_sent_total, email_failed_total, email_timeout_total, email_latency_ms, by_type]
      properties:
        email_sent_total:
          type: integer
          minimum: 0
        email_failed_total:
          type: integer
          minimum: 0
        email_timeout_total:
          type: integer
          minimum: 0
        email_latency_ms:
          $ref: '#/components/schemas/SecurityEmailLatency'
        by_type:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SecurityEmailMetricsByType'
    SecurityEmailMetricsByType:
      type: object
      required: [email_sent_total, email_failed_total, email_timeout_total, email_latency_ms]
      properties:
        email_sent_total:
          type: integer
          minimum: 0
        email_failed_total:
          type: integer
          minimum: 0
        email_timeout_total:
          type: integer
          minimum: 0
        email_latency_ms:
          $ref: '#/components/schemas/SecurityEmailLatency'
    SecurityObservabilityResponse:
