openapi: 3.0.3
info:
  title: Blobinfini API
  description: |
    Documentation officielle de l'API Blobinfini. Cette spécification décrit tous les endpoints exposés
    par l'API Express (matching, profils, réservation, messagerie, administration, etc.).
    Toute évolution de contrat (DTO, codes d'erreur) doit être reflétée ici.
  version: 0.2.1
  contact:
    name: Blobinfini Engineering
    email: dev@blobinfini.app
  license:
    name: Proprietary – Blobinfini SAS
    url: https://blobinfini.app/legal
servers:
  - url: https://api.blobinfini.app
    description: Production (Clever Cloud)
  - url: http://localhost:4000
    description: Développement local
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Observabilité et supervision de l'API
  - name: Auth
    description: Authentification, tokens, 2FA
  - name: Profiles
    description: Profils riders & administrateurs
  - name: Pros
    description: Gestion des profils et offres des professionnels
  - name: Matching
    description: Recherche et décisions de matching
  - name: Conversations
    description: Messagerie temps réel et gestion de conversations
  - name: Contact
    description: Demandes de contact rider ⇄ pro
  - name: Push
    description: Notifications push PWA
  - name: Reports
    description: Signalements utilisateurs
  - name: Admin
    description: Endpoints réservés aux administrateurs
  - name: Analytics
    description: Collecte analytics RGPD-safe (public + admin)
  - name: Blobosphere
    description: Contenus publics Blobosphère (read-only)
paths:
  /health:
    get:
      tags: [Health]
      summary: Vérifie que l'API est joignable
      operationId: healthCheck
      responses:
        '200':
          description: Statut en ligne
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /security/health:
    get:
      tags: [Health]
      summary: Retourne la posture sécurité canonique
      description: |
        Endpoint canonique de posture sécurité. Il expose uniquement l'état de configuration
        et des dépendances critiques de sécurité. Il n'expose pas l'état détaillé du pipeline
        de logs, qui relève de `/security/observability`.
      operationId: securityHealth
      security:
        - bearerAuth: []
        - securityMonitorToken: []
      responses:
        '200':
          description: Posture sécurité courante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /security/observability:
    get:
      tags: [Health]
      summary: Retourne l'état du pipeline de logs
      description: |
        Expose les métriques réelles du transport de logs serveur: queue courante,
        événements envoyés, pertes mesurées, échecs et état du circuit breaker.
      operationId: securityObservability
      security:
        - bearerAuth: []
        - securityMonitorToken: []
      responses:
        '200':
          description: État courant du pipeline de logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityObservabilityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /analytics/events:
    post:
      tags: [Analytics]
      summary: Enregistre un événement analytics public (RGPD)
      description: |
        Collecte strictement RGPD-safe : whitelist d'événements, consentement analytics requis,
        payload limité et champs inconnus refusés. Les données personnelles (IP, URL complète, lat/lng)
        sont rejetées ou ignorées.
      operationId: analyticsEventIngest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsPublicEventRequest'
      responses:
        '202':
          description: Événement accepté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsEventAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/register:
    post:
      tags: [Auth]
      summary: Crée un nouvel utilisateur
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Lancement initial limité à la France pour les comptes professionnels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authentifie un utilisateur et établit les cookies de session
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session créée via cookies `HttpOnly`, ou étape 2FA admin requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Consentement requis ou email non vérifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-2fa:
    post:
      tags: [Auth]
      summary: Valide le code 2FA admin et établit les cookies de session
      operationId: authVerifyAdmin2fa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTwoFactorVerifyRequest'
      responses:
        '200':
          description: Authentification admin complète via cookies `HttpOnly`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieSessionOkResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: IP admin non autorisée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Trop de challenges 2FA en attente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service 2FA indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Fait tourner la session à partir du refresh token body ou cookie
      operationId: authRefresh
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session rafraîchie via nouveaux cookies `HttpOnly`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieSessionOkResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalide les refresh tokens actifs
      operationId: authLogout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Déconnexion effectuée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Vérifie l'adresse email via un token
      operationId: authVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email vérifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Réeenvoie l'email de vérification
      operationId: authResendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Email de vérification envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Récupère les informations du compte connecté
      operationId: authMe
      responses:
        '200':
          description: Informations de l'utilisateur connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Initie un reset mot de passe (email + token)
      operationId: authForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Email de reset envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Réinitialise le mot de passe via un token valide
      operationId: authResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Mot de passe mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Met à jour le mot de passe d'un utilisateur authentifié
      operationId: authChangePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Mot de passe mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/2fa/send:
    post:
      tags: [Auth]
      summary: Envoie un code 2FA au format TOTP/email
      operationId: authSend2fa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorSendRequest'
      responses:
        '200':
          description: Code envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Valide un code 2FA PRO et établit les cookies de session
      operationId: authVerify2fa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
      responses:
        '200':
          description: Authentification PRO complète via cookies `HttpOnly`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorVerifyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verified-only:
    get:
      tags: [Auth]
      summary: Endpoint de test réservé aux comptes vérifiés
      operationId: authVerifiedOnly
      responses:
        '200':
          description: Accès autorisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /profile/me:
    get:
      tags: [Profiles]
      summary: Récupère le profil du rider/admin connecté
      operationId: profileGetMe
      responses:
        '200':
          description: Profil courant (rider ou admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Profiles]
      summary: Met à jour le profil rider/admin connecté
      operationId: profileUpdateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/disciplines:
    get:
      tags: [Profiles]
      summary: Liste les disciplines du rider
      operationId: profileListDisciplines
      responses:
        '200':
          description: Disciplines déclarées
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Discipline'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Profiles]
      summary: Remplace les disciplines du rider
      operationId: profileReplaceDisciplines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Discipline'
      responses:
        '200':
          description: Disciplines mises à jour
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Discipline'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/photo/upload-url:
    post:
      tags: [Profiles]
      summary: Génère une URL pré-signée d'upload photo rider
      operationId: profileUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType:
                  type: string
                  description: MIME type autorisé (image/jpeg, image/png, image/webp)
      responses:
        '200':
          description: URL d'upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pro/me:
    get:
      tags: [Pros]
      summary: Récupère le profil pro du compte connecté
      operationId: proGetMe
      responses:
        '200':
          description: Profil professionnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Pros]
      summary: Met à jour le profil pro du compte connecté
      operationId: proUpdateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProProfileUpdateRequest'
      responses:
        '200':
          description: Profil pro mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Profil professionnel temporairement limité à la France
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Trop de mises à jour (max 10 par 15 minutes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: RATE_LIMIT_EXCEEDED
                  message:
                    type: string
                    example: Trop de mises à jour de profil. Veuillez réessayer dans 15 minutes.
                  retryAfter:
                    type: integer
                    description: Nombre de secondes avant de pouvoir réessayer
    patch:
      tags: [Pros]
      summary: Met à jour partiellement le profil pro (rayon, infos)
      operationId: proPatchMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProProfileUpdateRequest'
      responses:
        '200':
          description: Profil pro mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Profil professionnel temporairement limité à la France
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Trop de mises à jour (max 10 par 15 minutes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: RATE_LIMIT_EXCEEDED
                  message:
                    type: string
                    example: Trop de mises à jour de profil. Veuillez réessayer dans 15 minutes.
                  retryAfter:
                    type: integer
                    description: Nombre de secondes avant de pouvoir réessayer

  /pro/delete-account:
    post:
      tags: [Pros]
      summary: Programme la suppression du compte pro avec confirmation explicite
      operationId: proDeleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Suppression programmée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionScheduledResponse'
        '400':
          description: Confirmation manquante ou compte déjà programmé pour suppression
        '404':
          description: Compte introuvable
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /pro/cancel-deletion:
    post:
      tags: [Pros]
      summary: Annule une suppression programmée sans step-up supplémentaire
      operationId: proCancelDeletion
      responses:
        '200':
          description: Suppression annulée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  cancelledAt:
                    type: string
                    format: date-time
        '400':
          description: Aucune suppression programmée ou période de grâce expirée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Compte introuvable
        '500':
          $ref: '#/components/responses/InternalError'

  /pro/deletion-status:
    get:
      tags: [Pros]
      summary: Lit le statut courant de suppression du compte pro
      operationId: proDeletionStatus
      responses:
        '200':
          description: Statut courant de suppression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProDeletionStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Compte introuvable
        '500':
          $ref: '#/components/responses/InternalError'

  /pro/photo/upload-url:
    post:
      tags: [Pros]
      summary: Génère une URL pré-signée pour photo/logo pro
      operationId: proPhotoUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType:
                  type: string
      responses:
        '200':
          description: URL d'upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pro/near/lessons:
    get:
      tags: [Pros]
      summary: Liste les riders proches ayant demandé un cours
      operationId: proNearLessons
      parameters:
        - in: query
          name: radiusKm
          schema:
            type: number
            minimum: 1
            maximum: 200
          description: Rayon de recherche en kilomètres (défaut 25)
        - in: query
          name: sport
          schema:
            type: string
            enum: [surf, kitesurf]
          description: Sport désiré (défaut surf)
      responses:
        '200':
          description: Riders à contacter
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LessonLead'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Recherche pro temporairement limitée à la France
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pro/dashboard/stats:
    get:
      tags: [Pros]
      summary: Statistiques du dashboard pro
      description: >
        Statistiques agrégées du professionnel connecté. Les mises en relation
        correspondent aux ContactRequest ACCEPTED : le rider a ouvert l'accès à
        la conversation. Cela ne signifie pas qu'un cours est réservé ou validé.
        Les champs acceptedContacts et acceptanceRate sont conservés comme alias
        rétrocompatibles.
      operationId: proDashboardStats
      responses:
        '200':
          description: Statistiques agrégées du pro connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProDashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /pro/offers/me:
    get:
      tags: [Pros]
      summary: Récupère les offres du professionnel connecté
      operationId: proGetOffers
      responses:
        '200':
          description: Liste d'offres
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Pros]
      summary: Supprime l'offre principale du professionnel
      operationId: proDeleteOffer
      responses:
        '204':
          description: Offre supprimée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pro/offers:
    post:
      tags: [Pros]
      summary: Crée ou met à jour l'offre principale
      operationId: proUpsertOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProOfferInput'
      responses:
        '201':
          description: Offre enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProOffer'
        '400':
