          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin]
      summary: Met à jour un article MDX
      operationId: adminBlobosphereUpdate
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
