openapi: 3.1.0
info:
  title: Blobinfini API
  description: |
    Documentation officielle de l'API Blobinfini. Cette spécification décrit tous les endpoints exposés
    par l'API Express (matching, profils, réservation, messagerie, administration, etc.).
    Toute évolution de contrat (DTO, codes d'erreur) doit être reflétée ici.
  version: 0.2.0
  contact:
    name: Blobinfini Engineering
    email: dev@blobinfini.app
  license:
    name: Proprietary – Blobinfini SAS
    url: https://blobinfini.app/legal
servers:
  - url: https://api.blobinfini.app
    description: Production (Clever Cloud)
  - url: http://localhost:4000
    description: Développement local
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Observabilité et supervision de l'API
  - name: Auth
    description: Authentification, tokens, 2FA
  - name: Profiles
    description: Profils riders & administrateurs
  - name: Pros
    description: Gestion des profils et offres des professionnels
  - name: Matching
    description: Recherche et décisions de matching
  - name: Booking
    description: Disponibilités, demandes et réservations de cours
  - name: Conversations
    description: Messagerie temps réel et gestion de conversations
  - name: Contact
    description: Demandes de contact rider ⇄ pro
  - name: Push
    description: Notifications push PWA
  - name: Reports
    description: Signalements utilisateurs
  - name: Admin
    description: Endpoints réservés aux administrateurs
paths:
  /health:
    get:
      tags: [Health]
      summary: Vérifie que l'API est joignable
      operationId: healthCheck
      responses:
        '200':
          description: Statut en ligne
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/register:
    post:
      tags: [Auth]
      summary: Crée un nouvel utilisateur
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authentifie un utilisateur et retourne les jetons
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Jetons d'accès ou étape 2FA requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Consentement requis ou email non vérifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rafraîchit l'access token à partir du refresh token
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Nouveaux jetons d'accès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalide les refresh tokens actifs
      operationId: authLogout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Déconnexion effectuée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Vérifie l'adresse email via un token
      operationId: authVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email vérifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Réeenvoie l'email de vérification
      operationId: authResendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Email de vérification envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Récupère les informations du compte connecté
      operationId: authMe
      responses:
        '200':
          description: Informations de l'utilisateur connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Initie un reset mot de passe (email + token)
      operationId: authForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Email de reset envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Réinitialise le mot de passe via un token valide
      operationId: authResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Mot de passe mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/2fa/send:
    post:
      tags: [Auth]
      summary: Envoie un code 2FA au format TOTP/email
      operationId: authSend2fa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorSendRequest'
      responses:
        '200':
          description: Code envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Valide un code 2FA et délivre les jetons
      operationId: authVerify2fa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
      responses:
        '200':
          description: Authentification complète
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verified-only:
    get:
      tags: [Auth]
      summary: Endpoint de test réservé aux comptes vérifiés
      operationId: authVerifiedOnly
      responses:
        '200':
          description: Accès autorisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /profile/me:
    get:
      tags: [Profiles]
      summary: Récupère le profil du rider/admin connecté
      operationId: profileGetMe
      responses:
        '200':
          description: Profil courant (rider ou admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Profiles]
      summary: Met à jour le profil rider/admin connecté
      operationId: profileUpdateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/disciplines:
    get:
      tags: [Profiles]
      summary: Liste les disciplines du rider
      operationId: profileListDisciplines
      responses:
        '200':
          description: Disciplines déclarées
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Discipline'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Profiles]
      summary: Remplace les disciplines du rider
      operationId: profileReplaceDisciplines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Discipline'
      responses:
        '200':
          description: Disciplines mises à jour
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Discipline'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/photo/upload-url:
    post:
      tags: [Profiles]
      summary: Génère une URL pré-signée d'upload photo rider
      operationId: profileUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType:
                  type: string
                  description: MIME type autorisé (image/jpeg, image/png, image/webp)
      responses:
        '200':
          description: URL d'upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pro/me:
    get:
      tags: [Pros]
      summary: Récupère le profil pro du compte connecté
      operationId: proGetMe
      responses:
        '200':
          description: Profil professionnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Pros]
      summary: Met à jour le profil pro du compte connecté
      operationId: proUpdateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProProfileUpdateRequest'
      responses:
        '200':
          description: Profil pro mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Pros]
      summary: Met à jour partiellement le profil pro (rayon, infos)
      operationId: proPatchMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProProfileUpdateRequest'
      responses:
        '200':
          description: Profil pro mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pro/photo/upload-url:
    post:
      tags: [Pros]
      summary: Génère une URL pré-signée pour photo/logo pro
      operationId: proPhotoUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType:
                  type: string
      responses:
        '200':
          description: URL d'upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pro/near/lessons:
    get:
      tags: [Pros]
      summary: Liste les riders proches ayant demandé un cours
      operationId: proNearLessons
      parameters:
        - in: query
          name: radiusKm
          schema:
            type: number
            minimum: 1
            maximum: 200
          description: Rayon de recherche en kilomètres (défaut 25)
        - in: query
          name: sport
          schema:
            type: string
            enum: [surf, kitesurf]
          description: Sport désiré (défaut surf)
      responses:
        '200':
          description: Riders à contacter
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LessonLead'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pro/offers/me:
    get:
      tags: [Pros]
      summary: Récupère les offres du professionnel connecté
      operationId: proGetOffers
      responses:
        '200':
          description: Liste d'offres
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Pros]
      summary: Supprime l'offre principale du professionnel
      operationId: proDeleteOffer
      responses:
        '204':
          description: Offre supprimée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pro/offers:
    post:
      tags: [Pros]
      summary: Crée ou met à jour l'offre principale
      operationId: proUpsertOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProOfferInput'
      responses:
        '200':
          description: Offre enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProOffer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pro/offers/me/toggle:
    patch:
      tags: [Pros]
      summary: Active ou désactive l'offre principale
      operationId: proToggleOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Offre mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pro/offers/search:
    get:
      tags: [Pros]
      summary: Recherche d'offres pro (filtrage par sport, niveau, géo)
      operationId: proSearchOffers
      parameters:
        - in: query
          name: sport
          schema:
            type: string
            enum: [surf, kitesurf]
        - in: query
          name: level
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
        - in: query
          name: lat
          schema:
            type: number
        - in: query
          name: lng
          schema:
            type: number
        - in: query
          name: radiusKm
          schema:
            type: number
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Résultats paginés
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProOfferSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /matching/search:
    post:
      tags: [Matching]
      summary: Cherche des profils compatibles
      operationId: matchingSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingSearchRequest'
      responses:
        '200':
          description: Résultats de matching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingSearchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /matching/decision:
    post:
      tags: [Matching]
      summary: Enregistre une décision (accept/refuse) pour un profil ciblé
      operationId: matchingDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingDecision'
      responses:
        '200':
          description: Décision enregistrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  createdConversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreatedConversation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /matching/decisions:
    post:
      tags: [Matching]
      summary: Traite un lot de décisions
      operationId: matchingBatchDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingBatchDecisions'
      responses:
        '200':
          description: Décisions traitées
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  createdConversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreatedConversation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /booking/availability:
    post:
      tags: [Booking]
      summary: Crée une disponibilité de cours (PRO)
      operationId: bookingCreateAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityInput'
      responses:
        '201':
          description: Disponibilité créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /booking/availability/me:
    get:
      tags: [Booking]
      summary: Liste les disponibilités du PRO courant
      operationId: bookingListAvailability
      responses:
        '200':
          description: Disponibilités du pro
          content:
            application/json:
              schema:
                type: object
                properties:
                  availabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Availability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /booking/availability/{availabilityId}:
    patch:
      tags: [Booking]
      summary: Modifie une disponibilité (PRO)
      operationId: bookingUpdateAvailability
      parameters:
        - in: path
          name: availabilityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityPartial'
      responses:
        '200':
          description: Disponibilité mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /booking/availability/search:
    get:
      tags: [Booking]
      summary: Recherche de disponibilités (RIDER)
      operationId: bookingSearchAvailability
      parameters:
        - in: query
          name: lat
          schema:
            type: number
        - in: query
          name: lng
          schema:
            type: number
        - in: query
          name: radiusKm
          schema:
            type: number
        - in: query
          name: sport
          schema:
            type: string
        - in: query
          name: level
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          description: Résultats de recherche
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/ValidationError'

  /booking/requests:
    post:
      tags: [Booking]
      summary: Crée une demande de cours (RIDER)
      operationId: bookingCreateRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequestInput'
      responses:
        '201':
          description: Demande enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /booking/requests/me:
    get:
      tags: [Booking]
      summary: Liste les demandes envoyées par le rider
      operationId: bookingListRiderRequests
      responses:
        '200':
          description: Demandes rider
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /booking/requests/inbox:
    get:
      tags: [Booking]
      summary: Liste les demandes à traiter pour le PRO
      operationId: bookingListProRequests
      responses:
        '200':
          description: Inbox pro
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingRequest'
        '401':
