backend:
  name: github
  repo: "<OWNER>/<REPO>"
  branch: "main"
  base_url: "http://localhost:3002"
  auth_endpoint: "api/decap/auth"

media_folder: "apps/web/public/uploads"
public_folder: "/uploads"

load_config_file: false

collections:
  - name: "blobosphere"
    label: "Blobosphère"
    folder: "apps/web/content/blobosphere"
    create: true
    extension: "mdx"
    slug: "{{slug}}"
    nested:
      depth: 2
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["surf","kitesurf","communaute","impact"] }
      - { label: "Extrait", name: "excerpt", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Statut", name: "status", widget: "select", options: ["draft","published"], default: "draft" }
      - { label: "Publié le", name: "publishedAt", widget: "datetime" }
      - { label: "Image de couverture", name: "coverImage", widget: "image", required: false }
      - { label: "Temps de lecture", name: "readingTime", widget: "number", required: false }
      - { label: "Contenu", name: "body", widget: "markdown" }
